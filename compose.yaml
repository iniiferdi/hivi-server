services:
  redis:
    image: redis:7-alpine
    container_name: hivi-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: hivi-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      HF_HOME: /app/cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/app/cache/huggingface
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  hf_cache: